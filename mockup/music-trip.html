<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T36 Music Trip — a whole album goes offline before the flight</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the whole app screen from source/, in Nocturne type; no grid on the app screen */
  #stage{background:#07080C}
  #stage .vm{position:absolute;left:0;top:0;--font:var(--f-text)}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one, no fade at the loop seam */
  #li-cursor svg{transform:scale(1.5);transform-origin:4px 3px}   /* the hand stays readable in a phone-sized reel */
  #li-cursor.down svg{transform:scale(1.3)}
  #stage .vm-btn.amber.li-hover{box-shadow:0 0 0 4px rgba(242,169,59,.28)}   /* the demo cursor hovers like a real one */
</style>
</head>
<body>
<div id="stage" data-title="T36 Music Trip" data-url="veraetogrex-portfolio.github.io/music-trip">
  <section class="vm" aria-label="VECTOR Music"></section>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const app = document.querySelector('.vm').musicApp;
const at = sel => { const r = Stage.rect(document.querySelector(sel)); return [r.cx, r.cy]; };
const REST = [1010, 610];
// owner 22.11: one reel of 12.4 s was "too fast", split in two — ?part=1 download, ?part=2 offline
const PART = new URLSearchParams(location.search).get('part') === '2' ? 2 : 1;
const DEMO = {
  // part 1: home → album → twelve waves pour → 12 of 12
  1: {
    reset: () => app.reset(),
    async demo(s) {
      const t0 = performance.now();
      await s.until(t0, 1200);                         // home at rest first (owner: the opening was too fast)
      await s.move(at('.vm-hero .vm-btn.amber'), 500); // "Prepare for the flight"
      await s.until(t0, 2300);
      await s.click(null, { hold: 110 });              // → album
      await s.until(t0, 2600);
      await s.move(at('[data-download]'), 400);
      await s.until(t0, 3300);
      await s.click(null, { hold: 120 });              // download: twelve waves pour one after another, ~3.5 s
      await s.until(t0, 8400);                         // 12 of 12 holds 1.5 s
      await s.move(REST, 450);                         // back to rest: the loop closes on frame one
      await s.until(t0, 9400);
    },
  },
  // part 2: the album is on this Mac → downloads → offline → it plays without a connection
  2: {
    reset: () => { app.reset(); app.complete(); app.go('album', true); },
    async demo(s) {
      const t0 = performance.now();
      await s.until(t0, 1000);                         // the downloaded album at rest
      await s.move(at('.vm-nav-i[data-go="downloads"]'), 450);
      await s.until(t0, 1600);
      await s.click(null, { hold: 110 });              // → downloads, the album lands first
      await s.until(t0, 3000);
      await s.move(at('[data-offline]'), 450);
      await s.until(t0, 3600);
      await s.click(null, { hold: 110 });              // offline mode: what is not on this Mac dims
      await s.until(t0, 5200);
      await s.move(at('[data-new]'), 450);
      await s.until(t0, 5800);
      await s.click(null, { hold: 110 });              // → the album, offline
      await s.until(t0, 6100);
      await s.move(at('[data-row="2"]'), 400);
      await s.until(t0, 6800);
      await s.click(null, { hold: 110 });              // track 3 plays from this Mac
      await s.until(t0, 8800);
      await s.move(REST, 400);                          // back to rest
      await s.until(t0, 9600);
    },
  },
}[PART];
Stage.init({ reset: DEMO.reset, cursorStart: REST, demo: DEMO.demo });
</script>
</body>
</html>
